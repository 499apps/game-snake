<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self'; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
    <meta name="referrer" content="no-referrer">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <title>Snake - 499apps Games</title>
    <meta name="description" content="Guide a friendly 3D snake to the apples. No ads, no tracking. Works offline.">
    <meta name="theme-color" content="#1b1740">
    <meta name="color-scheme" content="dark">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Snake">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <main class="g499-app game-app">
      <h1 class="g499-sr-only">Snake</h1>
      <div class="game-stage" id="stage"></div>
      <div class="g499-hud" aria-live="polite">
        <span class="g499-hud-pill" aria-label="Apples eaten">
          <span class="g499-icon" aria-hidden="true"><svg class="g499-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13.5" r="6.5"/><path d="M12 7c0-2 1-3.5 3-4"/></svg></span>
          <span class="game-hud-value" id="score">0</span>
        </span>
        <span class="g499-hud-pill game-hud-best" aria-label="Best">
          <span class="g499-icon" aria-hidden="true"><svg class="g499-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3.5 2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"/></svg></span>
          <span class="game-hud-value" id="best">0</span>
        </span>
      </div>
      <div class="g499-overlay" id="pause" hidden>
        <div class="g499-card">
          <h2>Paused</h2>
          <button type="button" class="g499-button" id="resume" aria-label="Play">
            <span class="game-pause-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 5v14l11-7z"/></svg></span>
          </button>
        </div>
      </div>
    </main>
  </body>
</html>
